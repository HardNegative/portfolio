<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato | Gabriel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <p><strong>Gabriel</strong></p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="sobre.html">Sobre</a>
            <a href="info.html">Informações</a>
            <a href="contato.html">Contato</a>
        </nav>
        <button id="tema">Modo escuro</button>
    </header>

    <main class="contato-container">
        <section class="contato-card">
            <h2>Fale comigo</h2>
            <form id="formulario" class="contato-form">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto</label>
                    <select name="assunto" id="assunto">
                        <option value="orcamento">Orçamento</option>
                        <option value="duvida">Dúvida</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea name="mensagem" id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
            <p id="resposta"></p>
        </section>
    </main>

    <footer>
        <p>2026 - Gabriel</p>
    </footer>
    <script src="js/contato.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
